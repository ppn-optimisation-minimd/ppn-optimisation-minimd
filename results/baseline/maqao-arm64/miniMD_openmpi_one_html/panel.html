<!DOCTYPE html>
<html translate="no" lang="en-US"><head><title>OV - miniMD_openmpi - Panel</title>
<meta charset="utf-8" />
<meta name="google" content="notranslate" />
<link rel="stylesheet" type="text/css" media="screen" href="css/ui.jqgrid.css" />
<link rel="stylesheet" type="text/css" href="css/themes/redmond_custom/jquery-ui.css" />
<link rel="stylesheet" type="text/css" href="css/themes/redmond_custom/jquery.jqplot.min.css" />
<link rel="stylesheet" type="text/css" href="css/MAQAO_theme.css" />
<link rel="stylesheet" type="text/css" href="css/maqao_modal.css" />
<link rel="stylesheet" type="text/css" href="css/global.css" />
<script src="js/jquery-1.9.0.min.js" ></script>
<script src="js/jquery-ui-1.10.3.custom.min.js" ></script>
<script src="js/grid.locale-en.js" ></script>
<script src="js/jquery.jqGrid.min.js" ></script>
<script src="js/d3.min.js" ></script>
<script class="include" src="js/chart.min.js"></script>
<script class="include" src="js/maqao_utils.js"></script>
<script src="js/flamegraph.js" ></script>
<script>
addLoadEvent(function(){
  var theme = localStorage.getItem("__MAQAO_OV_theme__");
  if (theme) {
    loadCSS("css/"+theme+".css");
  }
  else {
    localStorage.setItem("__MAQAO_OV_theme__", "MAQAO_theme");
    loadCSS("css/MAQAO_theme.css");
  }
});
</script>
</head><body>
<div id="__chartJS_tooltip" class="tt_chartJS"></div>
<div id="anchor_file_start"></div>
<div id="maqao_content">
<div id="main_section_div" data-path="" data-maxpath="" data-bucket="" data-maxbucket="" data-variants="">
  <div id="panelheader" style="background:var(--header_background_selected);text-align:center;height:25px;border-radius:5px;color:var(--header_font);">
    <h3 id="panelheadertext" >
      <span id="panelhelp" class="tooltip-maqao-button help-maqao" style="margin-top: 2px;" title="" tooltip_id=""></span>
    </h3>
  </div>
  <div id="panel">
  </div>
</div>
<script>
var SEC = null;
addLoadEvent(function(){
  // Load parameters
  var url = new URL(window.location.href);
  // Set values depending on parameters
  document.title = "ONE-View - " + url.searchParams.get("content");
  var main_sec = document.getElementById ("main_section_div");
  SEC = url.searchParams.get("sec");
  main_sec.dataset.path      = url.searchParams.get("path");
  main_sec.dataset.maxpath   = url.searchParams.get("maxpath");
  main_sec.dataset.bucket    = url.searchParams.get("bucket");
  main_sec.dataset.maxbucket = url.searchParams.get("maxbucket");
  main_sec.dataset.variants  = url.searchParams.get("variants");
  document.getElementById ("panelheadertext").innerHTML = url.searchParams.get("name") + document.getElementById ("panelheadertext").innerHTML;
  $("#panel").load(url.searchParams.get("content")+".html", function () {
      eval ("if (typeof "+SEC+"_onresize === \"function\") {"+SEC+"_onresize (\"panel\")}");
      eval ("if (typeof "+SEC+"_loadhelp === \"function\") {"+SEC+"_loadhelp (\"panelhelp\")}");
    });
});
function _onresize () {
  eval ("if (typeof "+SEC+"_onresize === \"function\") {"+SEC+"_onresize (\"panel\")}");
}
window.onresize = _onresize;
</script>

  <div id="MaqaoModal" class="maqao_modal">
    <div class="maqao_modal-content">
      <div class="maqao_modal-header">
        <span class="maqao_close">&times;</span>
      </div>
      <div id="maqao_modal-body" class="maqao_modal-body">
      </div>
    </div>
  </div>
</div><script>
var tooltips_texts = [];
var modal = document.getElementById('MaqaoModal');
var span = document.getElementsByClassName("maqao_close")[0];
span.onclick = function() {
    modal.style.display = "none";
}
window.onclick = function(event) {
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
const getCellValue = (tr, idx) => tr.children[idx].innerText || tr.children[idx].textContent;
const comparer = (idx, asc) => (a, b) => ((v1, v2) => 
    v1 !== '' && v2 !== '' && !isNaN(v1) && !isNaN(v2) ? v2 - v1 : v1.toString().localeCompare(v2)
    )(getCellValue(asc ? a : b, idx) === '' ? -1: (getCellValue(asc ? a : b, idx).replace(/\s/g,'')), 
      getCellValue(asc ? b : a, idx) === '' ? -1: (getCellValue(asc ? b : a, idx).replace(/\s/g,'')));
addLoadEvent(function(){
  document.querySelectorAll('._fixed_table:not(._no_auto_sorting) th').forEach(th => th.addEventListener('click', (() => {
    const table = th.closest('table');
    // Remove all symbols in header
    table.querySelectorAll('th').forEach(function (e) {
      e.firstChild.textContent = "";
    });
    // Change the symbol on the clicked header
    if (this.asc != true) {
      th.firstChild.textContent = "\u25BC";
    }
    else {
      th.firstChild.textContent = "\u25B2";
    }
    Array.from(table.querySelectorAll('tr:nth-child(n+2)'))
        .sort(comparer(Array.from(th.parentNode.children).indexOf(th), this.asc = !this.asc))
        .forEach(tr => table.appendChild(tr) );
  })));
});
addLoadEvent(function(){
  document.querySelectorAll('._tree_table:not(._no_auto_sorting) th').forEach(th => th.addEventListener('click', (() => {
    const table = th.closest('table');
    // Remove all symbols in header
    table.querySelectorAll('th').forEach(function (e) {
      e.firstChild.textContent = "";
    });
    // Change the symbol on the clicked header
    if (this.asc != true) {
      th.firstChild.textContent = "\u25BC";
    }
    else {
      th.firstChild.textContent = "\u25B2";
    }
    let last_id = "";
    const t_outermost = new Array ();
    const t_children  = new Map ();
    for (let i = 1, row; row = table.rows[i]; i++) {
      if (row.classList.contains ("_outer_row")) {
        t_outermost.push (row);
        last_id = row.id;
        t_children [last_id] = new Array ();
      }
      else {
        t_children [last_id].push (row);
      }
    }
    t_outermost.sort(comparer(Array.from(th.parentNode.children).indexOf(th), this.asc = !this.asc));
    for (let i = 0, row; row = t_outermost[i]; i++) {
      table.appendChild(row)
      for (let j = 0, child; child = t_children[row.id][j]; j++) {
        table.appendChild(child)
      }
    }
  })));
});
// Hide unselected tabs
addLoadEvent(function(){
  var x = document.getElementsByClassName("_tab_header_li");
  for (var i = 0; i < x.length; i++) {
    if (x[i].classList.contains("selected_tab") == false) {
      var e = document.getElementById (x[i].dataset.tab);
      e.style.display = "none";
    }
  }
});
</script>
</body>
</html>
